<!doctype html>
<html>
  <head><title>Netlify Form Stubs</title></head>
  <body>
    <!-- Standalone static page so Netlify's form scanner always picks these up. -->
    <form name="quote" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="services" />
      <textarea name="message"></textarea>
      <input type="text" name="budget" />
      <input type="text" name="priority" />
    </form>
    <form name="quick-quote" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
    </form>
  </body>
</html>
